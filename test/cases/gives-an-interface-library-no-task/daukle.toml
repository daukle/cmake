schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"

  [[toolchains.cmake.targets]]
  name        = "fixed"
  kind        = "library"
  libraryType = "static"
  sources     = ["src/fixed/*.c"]

  [[toolchains.cmake.targets]]
  name              = "headers"
  kind              = "library"
  libraryType       = "interface"
  interfaceIncludes = ["include"]
  interfaceDefines  = ["HEADERS_INLINE=1"]
  interfaceLinks    = ["fixed"]

  [[toolchains.cmake.targets]]
  name    = "app"
  sources = ["src/app/*.c"]
  links   = ["headers"]
