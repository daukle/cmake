schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"

  [[toolchains.cmake.targets]]
  name                 = "greet"
  kind                 = "library"
  sources              = ["src/greet/*.c"]
  systemIncludes       = ["vendor/private"]
  publicSystemIncludes = ["vendor/public"]
  publicFeatures       = ["c_std_11"]
  extensions           = false

  [[toolchains.cmake.targets]]
  name                    = "headers"
  kind                    = "library"
  libraryType             = "interface"
  interfaceSystemIncludes = ["vendor/headers"]
  interfaceFeatures       = ["c_std_99"]

  [[toolchains.cmake.targets]]
  name       = "app"
  sources    = ["src/app/*.c"]
  links      = ["greet", "headers"]
  includes   = ["include"]
  features   = ["c_std_11"]
  extensions = true
  outputName = "greeter-tool"
