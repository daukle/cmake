schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"
configureArgs = [
  "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=out",
  "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=out",
  "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=out",
  "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY_DEBUG=out",
]

  [[toolchains.cmake.targets]]
  name    = "Greeter"
  kind    = "library"
  sources = ["src/lib/*.c"]

  [[toolchains.cmake.targets]]
  name    = "app"
  sources = ["src/app/*.c"]
  links   = ["Greeter"]
