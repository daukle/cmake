schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"
configureArgs = ["-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON"]

  [[toolchains.cmake.targets]]
  name        = "greet"
  kind        = "library"
  libraryType = "shared"
  sources     = ["src/greet/*.c"]

  [[toolchains.cmake.targets]]
  name        = "count"
  kind        = "library"
  libraryType = "static"
  sources     = ["src/count/*.c"]

  [[toolchains.cmake.targets]]
  name    = "app"
  sources = ["src/app/*.c"]
  links   = ["greet", "count"]
