schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"

  [[toolchains.cmake.findPackages]]
  name    = "Threads"
  targets = ["Threads::Threads"]

  [[toolchains.cmake.findPackages]]
  name       = "Boost"
  version    = "1.80"
  components = ["filesystem", "system"]
  targets    = ["Boost::filesystem", "Boost::system"]

  [[toolchains.cmake.targets]]
  name        = "store"
  kind        = "library"
  sources     = ["src/store/*.c"]
  publicLinks = ["Boost::filesystem"]

  [[toolchains.cmake.targets]]
  name    = "app"
  sources = ["src/app/*.c"]
  links   = ["store", "Threads::Threads"]
