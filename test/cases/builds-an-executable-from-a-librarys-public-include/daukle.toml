schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"
configureArgs = [
  "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=out",
  "-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY_DEBUG=out",
]

  [[toolchains.cmake.targets]]
  name           = "greet"
  kind           = "library"
  sources        = ["src/lib/*.c"]
  publicIncludes = ["include"]
  publicDefines  = ["GREET_BASE=7"]

  [[toolchains.cmake.targets]]
  name    = "app"
  sources = ["src/app/*.c"]
  links   = ["greet"]
