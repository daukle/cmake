schema = 1
project = "example/app"
version = "1.0.0"

[modules]

[plugins]
cmake = "./plugins/cmake"

[toolchains.cmake]
version = "4.4"

  [[toolchains.cmake.targets]]
  name                 = "greet"
  kind                 = "library"
  libraryType          = "static"
  sources              = ["src/greet/*.c"]
  compileOptions       = ["-DGREET_PRIVATE=1"]
  publicCompileOptions = ["-DGREET_PUBLIC=3"]

  [[toolchains.cmake.targets]]
  name                    = "headers"
  kind                    = "library"
  libraryType             = "interface"
  interfaceCompileOptions = ["-DHEADERS_OPTION=2"]

  [[toolchains.cmake.targets]]
  name           = "app"
  sources        = ["src/app/*.c"]
  links          = ["greet", "headers"]
  compileOptions = ["-DAPP_OWN=4"]
